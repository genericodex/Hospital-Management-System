<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                template="../template.xhtml">

    <ui:define name="title">Dashboard</ui:define>

    <ui:define name="content">
        <h:head>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <!-- FullCalendar -->
            <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
            <script src="https://cdn.tailwindcss.com"/>

            <style>
                /* Fix Calendar Grid Visibility */
                .fc td, .fc th {
                    border: 1px solid #e2e8f0 !important;
                }
                .fc-theme-standard .fc-scrollgrid {
                    border: 1px solid #e2e8f0 !important;
                }
                .fc-col-header-cell {
                    background-color: #f8fafc;
                }
                /* Drag Handle Cursor */
                .drag-handle {
                    cursor: move;
                }
            </style>
        </h:head>

        <h:form id="dashboardForm">
            <p:growl id="msgs" showDetail="true"/>

            <!-- Dashboard Header & Toolbar -->
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 bg-white p-4 rounded-lg shadow-sm">
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold text-gray-700">Dashboard:</h2>
                    <p:selectOneMenu value="#{dashboardBean.currentLayoutId}" style="width: 200px;">
                        <f:selectItems value="#{dashboardBean.availableLayouts}" var="layout"
                                       itemLabel="#{layout.name}" itemValue="#{layout.id}"/>
                        <p:ajax listener="#{dashboardBean.switchLayout}" update="@form" oncomplete="loadDynamicData()"/>
                    </p:selectOneMenu>
                    <p:commandButton icon="pi pi-plus" title="New Dashboard"
                                     onclick="PF('newDashboardDialog').show()"
                                     styleClass="ui-button-outlined ui-button-secondary rounded-full"/>
                </div>

                <div class="flex gap-2">
                    <p:commandButton value="Refresh" icon="pi pi-refresh"
                                     actionListener="#{dashboardBean.loadChartData}"
                                     styleClass="ui-button-outlined ui-button-secondary"/>
                    <p:commandButton value="Add Widget" icon="pi pi-plus"
                                     actionListener="#{dashboardBean.initNewWidget}"
                                     oncomplete="PF('widgetDialog').show()"
                                     update=":widgetDialogForm"/>
                </div>
            </div>

            <!-- Dynamic Grid -->
            <div id="widgetGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <ui:repeat value="#{dashboardBean.currentLayout.widgets}" var="widget" varStatus="status">

                    <!-- Widget Wrapper -->
                    <div class="widget-item col-span-1 #{widget.type eq 'TABLE' ? 'md:col-span-2 lg:col-span-3' : (widget.type eq 'CALENDAR' ? 'md:col-span-2' : '')}"
                         data-widget-id="#{widget.id}">

                        <!-- Common Container Style -->
                        <div class="bg-white rounded-xl shadow-md border border-gray-100 h-full flex flex-col overflow-hidden" style="height: #{widget.type eq 'CALENDAR' ? '300%' : '100%'}">

                            <!-- FIX: Dedicated Drag Handle Header -->
                            <div class="drag-handle bg-gray-50 px-4 py-2 border-b border-gray-100 flex justify-between items-center">
                                <div class="flex items-center gap-2 text-gray-600">
                                    <i class="pi pi-arrows-alt text-gray-400"></i>
                                    <h3 class="font-bold text-sm uppercase tracking-wide">#{widget.title}</h3>
                                </div>
                                <div class="flex gap-1">
                                    <p:commandButton icon="pi pi-pencil" styleClass="rounded-full ui-button-flat ui-button-secondary ui-button-sm"
                                                     actionListener="#{dashboardBean.editWidget(widget)}"
                                                     oncomplete="PF('widgetDialog').show()" update=":widgetDialogForm"/>
                                    <p:commandButton icon="pi pi-trash" styleClass="rounded-full ui-button-flat ui-button-danger ui-button-sm"
                                                     actionListener="#{dashboardBean.deleteWidget(widget)}"
                                                     update=":dashboardForm"/>
                                </div>
                            </div>

                            <!-- Widget Content Area -->
                            <div class="p-4 flex-grow">

                                <!-- Card Content -->
                                <ui:fragment rendered="#{widget.type eq 'CARD'}">
                                    <div id="widget_#{status.index}" class="text-4xl font-bold text-blue-600 mt-2">-</div>
                                </ui:fragment>

                                <!-- Chart Content -->
                                <ui:fragment rendered="#{widget.type eq 'CHART'}">
                                    <div class="relative h-64 w-full">
                                        <canvas id="widget_#{status.index}"></canvas>
                                    </div>
                                </ui:fragment>

                                <!-- Table Content -->
                                <ui:fragment rendered="#{widget.type eq 'TABLE'}">
                                    <div id="widget_#{status.index}" class="overflow-auto max-h-64"></div>
                                </ui:fragment>

                                <!-- Calendar Content -->
                                <ui:fragment rendered="#{widget.type eq 'CALENDAR'}">
                                    <!-- FIX: Use inline style for height to guarantee full size -->
                                    <div id="widget_#{status.index}" style="height: 300% !important;"></div>
                                </ui:fragment>

                            </div>
                        </div>
                    </div>

                </ui:repeat>
            </div>

            <p:remoteCommand name="loadDynamicData" actionListener="#{dashboardBean.loadChartData}" autoRun="true"/>
            <p:remoteCommand name="updateWidgetPosition" actionListener="#{dashboardBean.handleReorder}"/>
        </h:form>

        <!-- New Dashboard Dialog -->
        <p:dialog header="Create New Dashboard" widgetVar="newDashboardDialog" modal="true" width="400" responsive="true">
            <h:form>
                <div class="field">
                    <p:outputLabel for="dashName" value="Dashboard Name"/>
                    <p:inputText id="dashName" value="#{dashboardBean.newDashboardName}" required="true" styleClass="w-full"/>
                </div>
                <div class="flex justify-end mt-4">
                    <p:commandButton value="Create" actionListener="#{dashboardBean.createNewDashboard}"
                                     update=":dashboardForm" styleClass="ui-button-primary"/>
                </div>
            </h:form>
        </p:dialog>

        <!-- Widget Configuration Dialog -->
        <p:dialog header="Configure Widget" widgetVar="widgetDialog" modal="true" width="600" responsive="true">
            <h:form id="widgetDialogForm">
                <p:messages showDetail="true" closable="true">
                    <p:autoUpdate/>
                </p:messages>

                <div class="grid grid-cols-2 gap-4 ui-fluid">
                    <div class="col-span-2">
                        <p:outputLabel value="Title *" for="wTitle"/>
                        <p:inputText id="wTitle" value="#{dashboardBean.newWidget.title}" required="true"/>
                    </div>

                    <div>
                        <p:outputLabel value="Type"/>
                        <p:selectOneMenu value="#{dashboardBean.newWidget.type}">
                            <f:selectItems value="#{dashboardBean.widgetTypes}"/>
                            <p:ajax update="@form"/>
                        </p:selectOneMenu>
                    </div>

                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CHART'}">
                        <p:outputLabel value="Chart Style"/>
                        <p:selectOneMenu value="#{dashboardBean.newWidget.chartType}">
                            <f:selectItems value="#{dashboardBean.chartTypes}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <div class="col-span-2">
                        <p:outputLabel value="Data Source (Table) *"/>
                        <p:selectOneMenu value="#{dashboardBean.newWidget.dataSourceTable}">
                            <f:selectItem itemLabel="Select Table" itemValue=""/>
                            <f:selectItems value="#{dashboardBean.availableTables}"/>
                            <p:ajax listener="#{dashboardBean.onTableChange}" update="fieldSelectX fieldSelectY tableCols calDate calTitle"/>
                        </p:selectOneMenu>
                    </div>

                    <!-- Chart: X-Axis -->
                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CHART'}" styleClass="col-span-1">
                        <p:outputLabel value="Group By (X-Axis) *"/>
                        <p:selectOneMenu id="fieldSelectX" value="#{dashboardBean.newWidget.XAxisField}">
                            <f:selectItems value="#{dashboardBean.availableFields}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <!-- Chart/Card: Y-Axis -->
                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CHART' or dashboardBean.newWidget.type eq 'CARD'}" styleClass="col-span-1">
                        <p:outputLabel value="Value Field (Y-Axis) *"/>
                        <p:selectOneMenu id="fieldSelectY" value="#{dashboardBean.newWidget.YAxisField}">
                            <f:selectItems value="#{dashboardBean.availableFields}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <!-- Table: Columns -->
                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'TABLE'}" styleClass="col-span-2">
                        <p:outputLabel value="Select Columns *"/>
                        <p:selectCheckboxMenu id="tableCols" value="#{dashboardBean.selectedTableColumns}" label="Columns"
                                              multiple="true" filter="true" filterMatchMode="startsWith" panelStyle="width: 250px">
                            <f:selectItems value="#{dashboardBean.availableFields}"/>
                        </p:selectCheckboxMenu>
                    </h:panelGroup>

                    <!-- Calendar: Date & Title -->
                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CALENDAR'}" styleClass="col-span-1">
                        <p:outputLabel value="Date Column *"/>
                        <p:selectOneMenu id="calDate" value="#{dashboardBean.newWidget.XAxisField}">
                            <f:selectItems value="#{dashboardBean.availableFields}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CALENDAR'}" styleClass="col-span-1">
                        <p:outputLabel value="Event Title Column *"/>
                        <p:selectOneMenu id="calTitle" value="#{dashboardBean.newWidget.YAxisField}">
                            <f:selectItems value="#{dashboardBean.availableFields}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{dashboardBean.newWidget.type eq 'CHART' or dashboardBean.newWidget.type eq 'CARD'}">
                        <p:outputLabel value="Aggregation"/>
                        <p:selectOneMenu value="#{dashboardBean.newWidget.aggregation}">
                            <f:selectItems value="#{dashboardBean.aggregationSelectItems}"/>
                        </p:selectOneMenu>
                    </h:panelGroup>

                    <div class="col-span-2">
                        <p:outputLabel value="Filter (HQL Clause)"/>
                        <p:inputText value="#{dashboardBean.newWidget.filterClause}" placeholder="e.g. status = 'SCHEDULED'"/>
                    </div>
                </div>

                <div class="mt-4 flex justify-end">
                    <p:commandButton value="Save" actionListener="#{dashboardBean.saveWidget}"
                                     update=":dashboardForm" styleClass="ui-button-success"/>
                </div>
            </h:form>
        </p:dialog>

        <script>
            //<![CDATA[
            $(function() {
                $("#widgetGrid").sortable({
                    items: ".widget-item",
                    handle: ".drag-handle", // FIX: Only drag when clicking the header
                    placeholder: "ui-state-highlight",
                    stop: function(event, ui) {
                        var ids = [];
                        $("#widgetGrid .widget-item").each(function() {
                            ids.push($(this).data("widget-id"));
                        });
                        updateWidgetPosition([{name: 'widgetOrder', value: ids.join(',')}]);
                    }
                });
                $("#widgetGrid").disableSelection();
            });

            function renderDynamicChart(canvasId, type, labels, data) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const existingChart = Chart.getChart(canvas);
                if (existingChart) existingChart.destroy();

                new Chart(canvas.getContext('2d'), {
                    type: type ? type.toLowerCase() : 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Value',
                            data: data,
                            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'],
                            borderWidth: 1
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                });
            }

            function updateCardValue(elementId, value) {
                const el = document.getElementById(elementId);
                if(el) el.innerText = value;
            }

            function renderDynamicTable(containerId, data) {
                const container = document.getElementById(containerId);
                if (!container) return;
                if (!data || !data.headers) {
                    container.innerHTML = '<p class="text-gray-400 text-center">No Data</p>';
                    return;
                }

                let html = '<table class="min-w-full text-sm text-left text-gray-500"><thead class="text-xs text-gray-700 uppercase bg-gray-50"><tr>';
                data.headers.forEach(h => html += '<th class="px-6 py-3">' + h + '</th>');
                html += '</tr></thead><tbody>';
                data.rows.forEach(row => {
                    html += '<tr class="bg-white border-b hover:bg-gray-50">';
                    row.forEach(cell => html += '<td class="px-6 py-4">' + cell + '</td>');
                    html += '</tr>';
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            function renderDynamicCalendar(containerId, events) {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = '';

                const calendar = new FullCalendar.Calendar(container, {
                    initialView: 'dayGridMonth',
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,listWeek' },
                    events: events,
                    height: '100%', // Will fill the 600px container
                    expandRows: true,
                    dayMaxEvents: true
                });
                calendar.render();
            }
            //]]>
        </script>
    </ui:define>
</ui:composition>
